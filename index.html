<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Short-form samples · luxury beauty &amp; travel</title>
<meta name="description" content="A 38-second luxury beauty and travel explainer Short, plus two more short-form pieces.">
<meta property="og:title" content="Short-form samples · luxury beauty &amp; travel">
<meta property="og:description" content="A 38-second luxury beauty and travel explainer Short, plus two more short-form pieces.">
<meta property="og:image" content="https://waxwingfactor.github.io/luxury-shorts-samples/media/braids-poster.jpg?v=1">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F3ECE1; --ink: #1F1913; --bronze: #9C7438; --muted: #8A7A66; --line: #E2D3B8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: Jost, system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: clamp(32px, 6vh, 64px) 18px 32px; min-height: 100vh; }
  .kicker { font-weight: 500; font-size: 12px; letter-spacing: .38em; text-transform: uppercase; color: var(--bronze); margin: 0; padding-left: .38em; text-align: center; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300; font-size: clamp(34px, 5vw, 54px); line-height: 1.02; margin: 12px 0 6px; text-align: center; }
  h1 em { font-weight: 400; color: var(--bronze); }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 clamp(22px, 4vh, 36px); text-align: center; }
  .rule { width: 56px; height: 1px; background: var(--bronze); margin: 14px auto 0; }
  /* 9:16 videos: the frame wraps the video exactly and shrinks to fit the window height. */
  .phone { width: min(400px, 88vw, calc((100vh - 120px) * 9 / 16)); padding: 9px; border-radius: 34px; background: var(--ink);
           box-shadow: 0 30px 70px rgba(40, 28, 14, .25); }
  .phone video { width: 100%; aspect-ratio: 9 / 16; height: auto; display: block; border-radius: 26px; background: #000; object-fit: contain; }
  video:fullscreen, video:-webkit-full-screen { object-fit: contain; width: 100%; height: 100%; max-width: none; border-radius: 0; }
  section.more { width: min(1080px, 100%); margin-top: clamp(56px, 9vh, 96px); border-top: 1px solid var(--line); padding-top: clamp(36px, 6vh, 56px); }
  section.more h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-style: italic; font-size: clamp(28px, 3.6vw, 38px); margin: 10px 0 clamp(26px, 4vh, 40px); text-align: center; }
  .grid { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 640px); gap: clamp(24px, 4vw, 48px); justify-content: center; align-items: center; }
  .grid .phone { width: min(330px, 88vw, calc((100vh - 120px) * 9 / 16)); justify-self: center; }
  .wide video { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 8px; background: #000; object-fit: contain; box-shadow: 0 24px 56px rgba(40, 28, 14, .22); }
  figure { margin: 0; }
  figcaption { margin-top: 14px; text-align: center; font-size: 14px; color: var(--muted); line-height: 1.5; }
  figcaption b { display: block; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: 22px; color: var(--ink); }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>3 rules for braids <em>in paradise</em></h1>
  <p class="sub">Vertical explainer Short · 9:16 · 1080 × 1920 · 38 s · AI visuals, licensed stock, AI voiceover</p>
  <div class="phone">
    <video controls playsinline preload="metadata" poster="media/braids-poster.jpg?v=1">
      <source src="media/braids-in-paradise.mp4?v=1" type="video/mp4">
    </video>
  </div>

  <section class="more">
    <p class="kicker">Two more short-form pieces</p>
    <div class="rule"></div>
    <h2>Different brands, same craft</h2>
    <div class="grid">
      <figure>
        <div class="phone">
          <video controls playsinline preload="none" poster="https://waxwingfactor.github.io/brightset-hype-reel/media/brightset-poster.jpg">
            <source src="https://waxwingfactor.github.io/brightset-hype-reel/media/brightset-hype-reel.mp4" type="video/mp4">
          </video>
        </div>
        <figcaption><b>Brightset</b>Coach-app hype reel · 9:16 · 21 s</figcaption>
      </figure>
      <figure class="wide">
        <video controls playsinline preload="none" poster="https://waxwingfactor.github.io/every-order-has-a-story/media/poster.jpg">
          <source src="https://waxwingfactor.github.io/every-order-has-a-story/media/every-order-has-a-story.mp4" type="video/mp4">
        </video>
        <figcaption><b>Every order has a story</b>Coffee-brand customer film · 16:9 · 30 s</figcaption>
      </figure>
    </div>
  </section>

</body>
</html>
